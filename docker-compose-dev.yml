services:
  web:
    container_name: ${ODOO_CONTAINER_NAME}
    # image: odoodev:${ODOO_VERSION}
    image: rrjorgegz/alastor:13.0
    command: -u all --dev=xml,qweb,reload
    depends_on:
      - db
    ports:
      - "${ODOO_PORT}:8069"
      - "${DEBUGPY_PORT}:${DEBUGPY_PORT}"
    volumes:
      - ./config_dev:/etc/odoo
      - odoo-web-data:/var/lib/odoo
      - ${ODOO_SERVER}:/var/lib/odoo/odoo
      - ${CUSTOM_ADDONS}:/mnt/extra-addons
    entrypoint: ${ENTRYPOINT}
  db:
    container_name: ${PG_CONTAINER_NAME}
    image: postgres:${PG_VERSION}
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD=${PG_PASSWORD}
      - POSTGRES_USER=${PG_USER}
      - PGDATA=/var/lib/postgresql/data/pgdata
    ports:
      - ${PG_PORT}:5432
    volumes:
      - pgdb-data:/var/lib/postgresql/data/pgdata
  pgadmin:
    image: dpage/pgadmin4
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=admin
      - PGADMIN_LISTEN_PORT=5050
    ports:
      - "5050:5050"
    depends_on:
      - db
    volumes:
      - odoo-pgadmin4-data:/var/lib/pgadmin

volumes:
  odoo-web-data:
  pgdb-data:
  odoo-pgadmin4-data:
